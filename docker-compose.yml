# Local development: Postgres + Redis, plus the API in SIMULATION MODE.
#   docker compose up -d db redis          # infra only, run the API with `pnpm dev:api`
#   docker compose --profile app up --build # everything in containers
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: amico
      POSTGRES_PASSWORD: amico_dev
      POSTGRES_DB: amico
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amico"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  migrate:
    profiles: ["app"]
    build: { context: ., dockerfile: infra/docker/api.Dockerfile, target: build }
    working_dir: /repo/apps/api
    command: sh -c "pnpm exec prisma migrate deploy && pnpm prisma:seed"
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgresql://amico:amico_dev@db:5432/amico?schema=public
    depends_on:
      db: { condition: service_healthy }

  api:
    profiles: ["app"]
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    env_file: apps/api/.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://amico:amico_dev@db:5432/amico?schema=public
      REDIS_URL: redis://redis:6379
      SIMULATION_MODE: "true"
      RUN_WORKERS: "true"
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
